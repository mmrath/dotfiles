# Kitty configuration
# https://sw.kovidgoyal.net/kitty/

# Font
font_family      family="Maple Mono NF"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        15.0
modify_font cell_height 110%

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Window
remember_window_size yes
window_padding_width 16
background_opacity 1.0
confirm_os_window_close 0

# Scrollback
scrollback_lines 10000

# Scrollbar
scrollbar always
scrollbar_width 1.0
scrollbar_hover_width 1.5
scrollbar_handle_opacity 0.6

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
active_tab_font_style bold

# Mouse
open_url_with default
url_style curly

# Theme - Catppuccin Latte (matches wezterm light theme)
foreground #4c4f69
background #eff1f5
cursor     #dc8a78

selection_foreground #4c4f69
selection_background #acb0be

# Normal colors
color0  #5c5f77
color1  #d20f39
color2  #40a02b
color3  #df8e1d
color4  #1e66f5
color5  #8839ef
color6  #179299
color7  #acb0be

# Bright colors
color8  #6c6f85
color9  #d20f39
color10 #40a02b
color11 #df8e1d
color12 #1e66f5
color13 #8839ef
color14 #179299
color15 #bcc0cc

# Tab bar colors
active_tab_foreground   #eff1f5
active_tab_background   #8839ef
inactive_tab_foreground #4c4f69
inactive_tab_background #bcc0cc
