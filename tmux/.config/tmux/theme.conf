# Tmux Theme - Soft Light

# Colors (softer than pure white)
thm_bg="#f5f5f0"
thm_fg="#24292f"
thm_accent="#0969da"
thm_green="#1a7f37"
thm_yellow="#9a6700"
thm_red="#cf222e"
thm_gray="#d0d7de"
thm_muted="#57606a"

# Status bar
set -g status-position top
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-fg "${thm_fg}"
set -g status-justify "centre"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style fg="${thm_fg}",bg="${thm_gray}"
set -g message-command-style fg="${thm_fg}",bg="${thm_gray}"

# Panes
set -g pane-border-style fg="${thm_gray}"
set -g pane-active-border-style fg="${thm_accent}"

# Windows
setw -g window-status-separator " "
setw -g window-status-style fg="${thm_muted}",bg="${thm_bg}",none
setw -g window-status-activity-style fg="${thm_yellow}",bg="${thm_bg}",none

# Status line content
session="#[fg=$thm_bg,bg=$thm_green,bold]  #S #[fg=$thm_green,bg=$thm_bg]"
host="#[fg=$thm_accent]#[fg=$thm_bg,bg=$thm_accent]  #h #[fg=$thm_accent,bg=$thm_bg]"
clock="#[fg=$thm_muted] %H:%M"

set -g status-left " ${session}"
set -g status-right "${host} ${clock} "

# Window status
setw -g window-status-format "#[fg=$thm_muted] #I:#W "
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_accent,bold] #I:#W #[fg=$thm_accent,bg=$thm_bg]"

# Clock and mode
setw -g clock-mode-colour "${thm_accent}"
setw -g mode-style "fg=${thm_bg} bg=${thm_accent} bold"
