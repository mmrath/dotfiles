# Alacritty configuration
# https://alacritty.org/config-alacritty.html

[window]
decorations = "Full"
opacity = 1.0
dimensions = { columns = 120, lines = 30 }
padding = { x = 4, y = 4 }

[scrolling]
history = 10000
multiplier = 3

[font]
size = 15.0
normal = { family = "Maple Mono NF", style = "Regular" }
bold = { family = "Maple Mono NF", style = "Bold" }
italic = { family = "Maple Mono NF", style = "Italic" }

[cursor]
style = { shape = "Beam", blinking = "On" }

[selection]
save_to_clipboard = true

# Soft light color scheme (easier on eyes than pure white)
[colors.primary]
background = "#f5f5f0"
foreground = "#24292f"

[colors.cursor]
text = "#ffffff"
cursor = "#24292f"

[colors.selection]
text = "#24292f"
background = "#c8e1ff"

# Colorblind-friendly: red→orange, green→blue
[colors.normal]
black = "#24292f"
red = "#dc6d09"
green = "#0969da"
yellow = "#b45309"
blue = "#0969da"
magenta = "#8250df"
cyan = "#1b7c83"
white = "#6e7781"

[colors.bright]
black = "#57606a"
red = "#c45d10"
green = "#0550ae"
yellow = "#9a5000"
blue = "#0550ae"
magenta = "#6639ba"
cyan = "#136061"
white = "#8c959f"
